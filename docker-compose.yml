services:
  postgres:
    image: postgres:16-alpine
    container_name: meeed-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeed_dev
    volumes:
      - meeed_pg_data:/var/lib/postgresql/data

volumes:
  meeed_pg_data:
